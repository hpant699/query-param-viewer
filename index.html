<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Query Param Viewer</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f4f9; }
        .output { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: inline-block; font-size: 24px; }
    </style>
</head>
<body>
    <div class="output" id="display">Loading...</div>

    <script>
        // Get the 'content' parameter from the URL safely
        const urlParams = new URLSearchParams(window.location.search);
        const textToShow = urlParams.get('content') || "Type ?content=YourText in the URL bar";
        
        // textContent safely escapes any HTML to prevent vulnerabilities
        document.getElementById('display').textContent = textToShow;
    </script>
</body>
</html>
